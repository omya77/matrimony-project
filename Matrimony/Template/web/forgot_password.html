<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/static/web/images/favicon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - ForeverBond</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      body {
        background: #f8fafc;
        font-family: "Poppins", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }
      .hidden-step {
        display: none;
      }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card glass-card p-5 border-0">
            <div class="text-center mb-4">
              <div
                class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                style="
                  width: 60px;
                  height: 60px;
                  background: linear-gradient(135deg, #e94057, #f97316);
                "
              >
                <i class="fa-solid fa-lock text-white fs-4"></i>
              </div>

              <h3 class="fw-bold">Forgot Password</h3>
              <p class="text-muted small" id="step-desc">
                Enter your Registered Email or Mobile Number to receive an OTP.
              </p>
            </div>

            {% if messages %} {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
            {% endfor %} {% endif %}

            <!-- STEP 1: IDENTIFIER -->
            <div id="step-1">
              <div class="mb-3">
                <label class="form-label text-muted small fw-semibold"
                  >Email or Mobile Number</label
                >
                <input
                  type="text"
                  id="identifierInput"
                  class="form-control rounded-pill px-4 py-2"
                  placeholder="user@example.com or 9876543210"
                />
              </div>
              <button
                type="button"
                onclick="sendOTP()"
                id="sendOtpBtn"
                class="btn w-100 rounded-pill text-white fw-bold py-2 shadow-sm"
                style="background: linear-gradient(135deg, #e94057, #f97316)"
              >
                Send OTP
              </button>
            </div>

            <!-- STEP 2: OTP -->
            <div id="step-2" class="hidden-step">
              <div class="mb-3">
                <label class="form-label text-muted small fw-semibold"
                  >Enter OTP (Sent to Email/Mobile)</label
                >
                <input
                  type="text"
                  id="otpInput"
                  class="form-control rounded-pill px-4 py-2"
                  placeholder="4-digit OTP"
                />
              </div>
              <button
                type="button"
                onclick="verifyOTP()"
                id="verifyOtpBtn"
                class="btn w-100 rounded-pill text-white fw-bold py-2 shadow-sm"
                style="background: #10b981"
              >
                Verify OTP
              </button>
            </div>

            <!-- STEP 3: NEW PASSWORD -->
            <form
              id="step-3"
              class="hidden-step"
              method="POST"
              action="{% url 'forgot_password' %}"
            >
              {% csrf_token %}
              <input type="hidden" name="identifier" id="finalIdentifier" />
              <div class="mb-3">
                <label class="form-label text-muted small fw-semibold"
                  >New Password</label
                >
                <input
                  type="password"
                  name="new_password"
                  id="newPass"
                  class="form-control rounded-pill px-4 py-2"
                  required
                  placeholder="Enter new password"
                />
              </div>
              <div class="mb-4">
                <label class="form-label text-muted small fw-semibold"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  name="confirm_password"
                  id="confirmPass"
                  class="form-control rounded-pill px-4 py-2"
                  required
                  placeholder="Confirm new password"
                />
              </div>
              <button
                type="submit"
                onclick="return checkPass();"
                class="btn w-100 rounded-pill text-white fw-bold py-2 shadow-sm"
                style="background: linear-gradient(135deg, #e94057, #f97316)"
              >
                Set New Password
              </button>
            </form>

            <div class="text-center mt-4">
              <a
                href="{% url 'login' %}"
                class="text-decoration-none text-muted small"
                ><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let userIden = "";

      function sendOTP() {
        userIden = document.getElementById("identifierInput").value;
        if (!userIden) {
          alert("Please enter Email or Mobile number");
          return;
        }

        document.getElementById("sendOtpBtn").innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

        fetch("/accounts/api/send_forgot_otp/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: userIden }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              document.getElementById("step-1").classList.add("hidden-step");
              document.getElementById("step-2").classList.remove("hidden-step");
              document.getElementById("step-desc").innerText =
                "Enter the OTP sent to " + userIden;
              alert(
                "For testing, please check terminal/console for OTP! Real SMS/Email is sent if configured.",
              );
            } else {
              alert(data.message);
              document.getElementById("sendOtpBtn").innerHTML = "Send OTP";
            }
          })
          .catch((err) => {
            alert("Error: " + err);
            document.getElementById("sendOtpBtn").innerHTML = "Send OTP";
          });
      }

      function verifyOTP() {
        const otp = document.getElementById("otpInput").value;
        if (!otp) {
          alert("Please enter OTP");
          return;
        }

        document.getElementById("verifyOtpBtn").innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

        fetch("/accounts/api/verify_forgot_otp/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ otp: otp }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              document.getElementById("step-2").classList.add("hidden-step");
              document.getElementById("step-3").classList.remove("hidden-step");
              document.getElementById("step-desc").innerText =
                "Set your new password.";
              document.getElementById("finalIdentifier").value = userIden;
            } else {
              alert(data.message);
              document.getElementById("verifyOtpBtn").innerHTML = "Verify OTP";
            }
          })
          .catch((err) => {
            alert("Error: " + err);
            document.getElementById("verifyOtpBtn").innerHTML = "Verify OTP";
          });
      }

      function checkPass() {
        const p1 = document.getElementById("newPass").value;
        const p2 = document.getElementById("confirmPass").value;
        if (p1 !== p2) {
          alert("Passwords do not match!");
          return false;
        }
        return true;
      }
    </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/web/js/navbar.js?v=5"></script>
    <script src="/static/web/js/global-interactions.js"></script>
  </body>
</html>
