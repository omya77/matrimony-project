<!-- 6. Scripts: AOS Trigger + Sticky Scroll Engine + Automatic Intelligent Active Class Linker -->
<script>
  // AOS Initialization
  if (typeof AOS !== "undefined") {
    AOS.init({
      duration: 800,
      once: true,
    });
  }

  // Dynamic Full Width Scroll Transition Engine
  window.addEventListener("scroll", function () {
    const stickyWrapper = document.getElementById("stickyNavWrapper");
    if (window.scrollY > 180) {
      stickyWrapper.classList.add("nav-scrolled-wide");
    } else {
      stickyWrapper.classList.remove("nav-scrolled-wide");
    }
  });

  // INTELLIGENT AUTOMATIC ACTIVE LINK DETECTOR (Pure JS Engine)
  document.addEventListener("DOMContentLoaded", function () {
    const currentPath = window.location.pathname;

    // 1. Process Desktop Navigation links
    const desktopLinks = document.querySelectorAll(".ultra-nav-link");
    desktopLinks.forEach((link) => {
      const linkHref = link.getAttribute("href");
      if (
        linkHref &&
        (linkHref === currentPath ||
          (currentPath === "/" && linkHref.includes("index.html")))
      ) {
        link.classList.add("active-premium-link");
      }
    });

    // 2. Process Desktop Nested Dropdown Items inside Blog
    const dropdownItems = document.querySelectorAll(".custom-drop-item");
    dropdownItems.forEach((item) => {
      const itemHref = item.getAttribute("href");
      if (
        itemHref &&
        (itemHref === currentPath ||
          (currentPath === "/" && itemHref.includes("index.html")))
      ) {
        // Dropdown item ko highlight karne ke sath Parent Blog button ko active look dena
        const parentDropdown = item.closest(".custom-premium-dropdown");
        if (parentDropdown) {
          const mainToggle = parentDropdown.querySelector(".ultra-nav-link");
          if (mainToggle) mainToggle.classList.add("active-premium-link");
        }
      }
    });

    // 3. Process Mobile Sheet Layout navigation links
    const mobileLinks = document.querySelectorAll(".mobile-nav-link");
    mobileLinks.forEach((mobLink) => {
      const mobHref = mobLink.getAttribute("href");
      if (
        mobHref &&
        (mobHref === currentPath ||
          (currentPath === "/" && mobHref.includes("index.html")))
      ) {
        mobLink.classList.add("active-mobile");

        // Agar page mobile accordion collapse ke andar hai to wrapper open status active karega
        const parentCollapse = mobLink.closest(".collapse");
        if (parentCollapse) {
          parentCollapse.classList.add("show");
          // Parent headers highlight tracker
          const toggler = document.querySelector(
            `[href="#${parentCollapse.id}"]`,
          );
          if (toggler) toggler.classList.add("active-mobile");
        }
      }
    });
  });
</script>
