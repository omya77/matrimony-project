<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeverBond Admin Executive Portal</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><path fill=%22%23ff2a5f%22 d=%22M47.6 300.4L228.3 469.1c7.5 7 17.4 10.9 27.7 10.9s20.2-3.9 27.7-10.9L464.4 300.4c30.4-28.3 47.6-68 47.6-109.5v-5.8c0-69.9-50.5-129.5-119.4-141C347 36.5 300.6 51.4 268 84L256 96 244 84c-32.6-32.6-79-47.5-124.6-39.9C50.5 55.6 0 115.2 0 185.1v5.8c0 41.5 17.2 81.2 47.6 109.5z%22/></svg>">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --rose: #4f46e5;
            --rose-glow: rgba(79, 70, 229, 0.6);
            --gold: #8b5cf6;
            --gold-glow: rgba(139, 92, 246, 0.5);
            --purple: #3b82f6;
            --cyan: #06b6d4;
            
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(79, 70, 229, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
            background-color: #07050a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.25) 0px, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.2) 0px, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Animated Glowing Neon Spheres in Background */
        .ambient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.65;
            z-index: 0;
            animation: floatSphere 12s infinite alternate ease-in-out;
        }
        .sphere-1 {
            max-width: 420px; width: 100%; height: 420px;
            background: linear-gradient(135deg, var(--rose), var(--purple));
            top: -15%; left: -10%;
        }
        .sphere-2 {
            width: 380px; height: 380px;
            background: linear-gradient(135deg, var(--gold), #ea580c);
            bottom: -15%; right: -10%;
            animation-delay: -4s;
        }
        .sphere-3 {
            width: 320px; height: 320px;
            background: linear-gradient(135deg, var(--cyan), var(--rose));
            bottom: 25%; left: 15%;
            animation-delay: -8s;
        }

        @keyframes floatSphere {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 40px) scale(1.2); }
            100% { transform: translate(-30px, 60px) scale(0.9); }
        }

        /* Ultra-Premium Glass Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: var(--glass-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            width: 100%;
            max-max-width: 450px; width: 100%;
            padding: 50px 42px;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 42, 95, 0.4);
            box-shadow: 0 35px 90px rgba(0, 0, 0, 0.8), 0 0 70px rgba(255, 42, 95, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.35);
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Shimmering Top Laser Border */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--rose), var(--purple), var(--gold), var(--cyan), var(--rose));
            background-size: 300% 100%;
            border-radius: 32px 32px 0 0;
            animation: laserShimmer 5s linear infinite;
        }

        @keyframes laserShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        .brand {
            margin-bottom: 35px;
        }
        
        .brand-icon-box {
            width: 80px; height: 80px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, rgba(255, 42, 95, 0.2), rgba(245, 158, 11, 0.2));
            border: 1px solid rgba(255, 42, 95, 0.4);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(255, 42, 95, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transform: rotate(-5deg);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .login-card:hover .brand-icon-box {
            transform: rotate(0deg) scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 42, 95, 0.5);
        }

        .brand i {
            background: linear-gradient(135deg, #ff2a5f, #ffb800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.6rem;
            filter: drop-shadow(0 2px 8px rgba(255, 42, 95, 0.5));
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            font-size: 2.3rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .brand h1 span {
            background: linear-gradient(135deg, #ff2a5f, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            color: #64748b;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            font-size: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            color: #ffffff;
            background: rgba(10, 8, 16, 0.6);
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .input-wrapper input::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: #ff2a5f;
            background: rgba(15, 12, 24, 0.85);
            box-shadow: 0 0 0 4px rgba(255, 42, 95, 0.25), 0 10px 25px rgba(255, 42, 95, 0.2);
            transform: translateY(-2px);
        }

        .input-wrapper input:focus + i,
        .input-wrapper:focus-within i {
            color: #ff2a5f;
            filter: drop-shadow(0 0 8px rgba(255, 42, 95, 0.8));
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            margin-top: 12px;
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 50%, #3b82f6 100%);
            background-size: 200% auto;
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.08rem;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .login-btn:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 45px rgba(255, 42, 95, 0.6), 0 0 30px rgba(245, 158, 11, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .messages {
            margin-bottom: 24px;
        }

        .error {
            background: rgba(225, 29, 72, 0.2);
            color: #ffa4bc;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(225, 29, 72, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
            text-align: left;
        }

        .forgot-link {
            font-size: 0.82rem;
            color: #ff7aa2;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .forgot-link:hover {
            color: #ffffff;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(255, 122, 162, 0.8);
        }

        .footer-note {
            margin-top: 35px;
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .footer-note i {
            color: #059669;
            filter: drop-shadow(0 0 5px rgba(5, 150, 105, 0.8));
        }
    </style>
</head>
<body>
    <!-- Ambient Neon Glowing Spheres -->
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    <div class="ambient-sphere sphere-3"></div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon-box">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1>Reset<span>Password</span></h1>
            <p>Admin Recovery System</p>
        </div>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'admin_forgot_password' %}">
            {% csrf_token %}
            <div class="input-group">
                <label>Admin Email ID</label>
                <div class="input-wrapper">
                    <input type="email" name="email" placeholder="Enter your registered email..." required autocomplete="email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            
            <button type="submit" class="login-btn">
                <span>Send OTP to Email</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="{% url 'admin_login' %}" class="forgot-link">Back to Login</a>
            </div>
        </form>

        <div class="footer-note">
            <i class="fa-solid fa-shield-check"></i> 256-Bit SSL Encrypted & Protected
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('passwordField');

        if(togglePassword) {
            togglePassword.addEventListener('click', function (e) {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
            });
        }
    </script>
</body>
</html>
