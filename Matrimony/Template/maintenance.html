<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #1e293b;
        }

        .maintenance-card {
            background: white;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
            max-max-width: 500px; width: 100%;
            width: 90%;
            border: 1px solid #e2e8f0;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #fff1f2;
            color: #e11d48;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        p {
            font-size: 1.1rem;
            color: #64748b;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }

        .contact-support {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1>We'll be back soon!</h1>
        <p>Sorry for the inconvenience. We're performing some maintenance at the moment to improve your experience. We'll be back online shortly.</p>
        <div class="contact-support">
            &mdash; The Development Team A2z-IP-7 Team 4
        </div>
    </div>
</body>
</html>
